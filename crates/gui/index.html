<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Mnemonic</title>
  <meta name="description" content="Turn numbers into memorable sentences with the Mnemonic Major System — and back again." />
  <link data-trunk rel="rust" data-bin="mnemonic-gui" data-wasm-opt="z" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
    @media (prefers-color-scheme: light) { html, body { background: #f8f8f8; } }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font: 16px system-ui, sans-serif; color: #888; text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="mnemonic_canvas"></canvas>
  <p id="loading">Loading&hellip;</p>
</body>
</html>
